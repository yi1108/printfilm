# 本机开发：nginx 托管 frontend/dist，反代 API
# 启动：在 nginx 安装目录执行
#   nginx.exe -p C:/Users/L1822/nginx-1.26.3 -c C:/Users/L1822/IdeaProjects/ai_movie/deploy/nginx.local.conf

worker_processes  1;

error_log  logs/ai_movie_error.log;
pid        logs/ai_movie.pid;

events {
    worker_connections  1024;
}

http {
    include       C:/Users/L1822/nginx-1.26.3/conf/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream ai_movie_api {
        server 127.0.0.1:8000;
    }

    server {
        listen       80;
        server_name  localhost 127.0.0.1;

        # 易支付回调（生产约定：勿含 /api/）
        location = /epay/notify {
            proxy_pass http://ai_movie_api/api/billing/epay/notify;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://ai_movie_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /static/ {
            proxy_pass http://ai_movie_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root   C:/Users/L1822/IdeaProjects/ai_movie/frontend/dist;
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
